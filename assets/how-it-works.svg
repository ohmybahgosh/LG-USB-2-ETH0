<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t d">
  <title id="t">Before and after LG-USB-2-ETH0</title>
  <desc id="d">Before: webOS and its apps use eth0, the 100 Mbit/s built-in port, while the USB adapter sits unused as eth1.  After: the USB adapter is eth0 and carries the traffic at about 300 Mbit/s, and the built-in port is parked as eth2.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#101a16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#22e584" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22e584" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .flow { stroke-dasharray: 10 12; animation: flow 1.1s linear infinite; }
      .slow { animation-duration: 3.2s; }
      @keyframes flow { to { stroke-dashoffset: -22; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="520" fill="url(#bg)"/>
  <rect width="1280" height="520" fill="url(#glow)"/>

  <!-- ===== Before ===== -->
  <g transform="translate(60 0)">
    <text x="0" y="62" class="sans" font-size="16" font-weight="700" fill="#6f7f78" letter-spacing="3">BEFORE</text>
    <text x="0" y="96" class="sans" font-size="28" font-weight="800" fill="#f2f5f3">webOS uses the slow port</text>

    <!-- webOS box -->
    <rect x="80" y="128" width="320" height="68" rx="16" fill="#16201c" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="240" y="170" text-anchor="middle" class="sans" font-size="21" font-weight="700" fill="#e8efeb">webOS and its apps</text>

    <!-- link to eth0 (built-in) -->
    <path d="M115 196 V 262" stroke="#febc2e" stroke-width="4" fill="none" class="flow slow"/>
    <!-- no link to the adapter -->
    <path d="M365 196 V 262" stroke="#2b3632" stroke-width="4" stroke-dasharray="4 10" fill="none"/>

    <!-- built-in port -->
    <rect x="0" y="262" width="230" height="150" rx="20" fill="#111a17" stroke="#febc2e" stroke-opacity="0.55" stroke-width="2"/>
    <text x="26" y="304" class="mono" font-size="30" font-weight="700" fill="#febc2e">eth0</text>
    <text x="26" y="340" class="sans" font-size="19" font-weight="600" fill="#e8efeb">Built-in port</text>
    <text x="26" y="372" class="sans" font-size="17" fill="#93a39b">100 Mbit/s max</text>

    <!-- USB adapter -->
    <rect x="250" y="262" width="230" height="150" rx="20" fill="#111a17" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="276" y="304" class="mono" font-size="30" font-weight="700" fill="#6f7f78">eth1</text>
    <text x="276" y="340" class="sans" font-size="19" font-weight="600" fill="#93a39b">USB adapter</text>
    <text x="276" y="372" class="sans" font-size="17" fill="#6f7f78">unused by webOS</text>

    <!-- symptoms -->
    <g class="sans" font-size="17" fill="#93a39b">
      <circle cx="8" cy="452" r="5" fill="#ff5f57"/>
      <text x="24" y="458">Settings say "Not Connected"</text>
      <circle cx="8" cy="484" r="5" fill="#ff5f57"/>
      <text x="24" y="490">Some streaming apps refuse to play</text>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(640 337)">
    <circle r="34" fill="#16201c" stroke="#22e584" stroke-opacity="0.4" stroke-width="2" class="pulse"/>
    <path d="M-12 0 H12 M3 -10 L13 0 L3 10" stroke="#22e584" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- ===== After ===== -->
  <g transform="translate(740 0)">
    <text x="0" y="62" class="sans" font-size="16" font-weight="700" fill="#22e584" letter-spacing="3">AFTER</text>
    <text x="0" y="96" class="sans" font-size="28" font-weight="800" fill="#f2f5f3">The adapter is eth0</text>

    <rect x="80" y="128" width="320" height="68" rx="16" fill="#16201c" stroke="#22e584" stroke-opacity="0.35"/>
    <text x="240" y="170" text-anchor="middle" class="sans" font-size="21" font-weight="700" fill="#e8efeb">webOS and its apps</text>

    <!-- no link to built-in -->
    <path d="M115 196 V 262" stroke="#2b3632" stroke-width="4" stroke-dasharray="4 10" fill="none"/>
    <!-- link to the adapter -->
    <path d="M365 196 V 262" stroke="#22e584" stroke-width="5" fill="none" class="flow"/>

    <!-- built-in port, parked -->
    <rect x="0" y="262" width="230" height="150" rx="20" fill="#111a17" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="26" y="304" class="mono" font-size="30" font-weight="700" fill="#6f7f78">eth2</text>
    <text x="26" y="340" class="sans" font-size="19" font-weight="600" fill="#93a39b">Built-in port</text>
    <text x="26" y="372" class="sans" font-size="17" fill="#6f7f78">parked, still works</text>

    <!-- USB adapter -->
    <rect x="250" y="262" width="230" height="150" rx="20" fill="#13261d" stroke="#22e584" stroke-width="2"/>
    <text x="276" y="304" class="mono" font-size="30" font-weight="700" fill="#22e584">eth0</text>
    <text x="276" y="340" class="sans" font-size="19" font-weight="600" fill="#e8efeb">USB adapter</text>
    <text x="276" y="372" class="sans" font-size="17" fill="#93a39b">about 300 Mbit/s</text>

    <g class="sans" font-size="17" fill="#93a39b">
      <circle cx="8" cy="452" r="5" fill="#22e584"/>
      <text x="24" y="458">Settings show the wired connection</text>
      <circle cx="8" cy="484" r="5" fill="#22e584"/>
      <text x="24" y="490">Apps play, two to three times faster</text>
    </g>
  </g>
</svg>
