<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">LG-USB-2-ETH0</title>
  <desc id="d">A terminal running LG-USB-2-ETH0 apply: the built-in port becomes eth2 and the USB adapter becomes eth0</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#111a17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22e584" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22e584" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <style>
      .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .l { opacity: 0; animation: show 9s steps(1) infinite; }
      .l1 { animation-name: s1; } .l2 { animation-name: s2; } .l3 { animation-name: s3; } .l4 { animation-name: s4; }
      @keyframes s1 { 0% { opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes s2 { 0% { opacity: 0; } 22% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes s3 { 0% { opacity: 0; } 36% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes s4 { 0% { opacity: 0; } 50% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } .cur { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- Wordmark -->
  <text x="72" y="168" class="sans" font-size="60" font-weight="800" fill="#f2f5f3" letter-spacing="-1.2">LG-USB-2-ETH0</text>
  <text x="74" y="214" class="sans" font-size="23" font-weight="500" fill="#93a39b">Gigabit USB Ethernet as the TV's eth0,</text>
  <text x="74" y="245" class="sans" font-size="23" font-weight="500" fill="#93a39b">on rooted LG webOS TVs.</text>
  <rect x="74" y="280" width="56" height="4" rx="2" fill="#22e584"/>

  <!-- Terminal -->
  <g transform="translate(600 62)" filter="url(#shadow)">
    <rect width="612" height="276" rx="14" fill="#0e1513" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect width="612" height="40" rx="14" fill="#16201c"/>
    <rect y="26" width="612" height="14" fill="#16201c"/>
    <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="20" r="6" fill="#febc2e"/>
    <circle cx="64" cy="20" r="6" fill="#28c840"/>
    <text x="306" y="25" text-anchor="middle" class="mono" font-size="13" fill="#6f7f78">root@LGwebOSTV: ~</text>

    <g class="mono" font-size="17">
      <text x="28" y="86"><tspan fill="#22e584">#</tspan><tspan fill="#e8efeb"> sh LG-USB-2-ETH0.sh apply</tspan></text>
      <text class="l l1" x="28" y="124" fill="#93a39b">Built-in eth0 <tspan fill="#5b6a63">-&gt;</tspan> eth2</text>
      <text class="l l2" x="28" y="156" fill="#93a39b">USB eth1 (r8152) <tspan fill="#5b6a63">-&gt;</tspan> <tspan fill="#22e584" font-weight="700">eth0</tspan></text>
      <text class="l l3" x="28" y="196" fill="#22e584">✔ Done: the USB adapter is eth0.</text>
      <text class="l l4" x="28" y="236"><tspan fill="#22e584">#</tspan><tspan fill="#e8efeb"> </tspan></text>
      <g class="l l4"><rect class="cur" x="48" y="221" width="10" height="20" fill="#e8efeb"/></g>
    </g>
  </g>
</svg>
