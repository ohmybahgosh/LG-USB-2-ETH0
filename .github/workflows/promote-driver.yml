name: Promote a tested driver

# When a driver test report says the driver works, open a pull request that
# moves it from the drivers waiting for testers to the tested ones, so
# get-driver and Faster driver offer it.  Nothing is merged or released
# without a person: review the pull request, merge it, then tag a release.
#
# Some tests use a real kernel's untested drivers as their example, so
# moving one of those drivers can fail a test (it did for #59).  Then the
# pull request still opens, as a draft that names the failing tests, so the
# report is never dropped without anyone knowing.
#
# A report posted as a comment on a driver test issue counts too (#27's
# working report was a comment), but only one from the person who opened the
# issue or from the maintainer.
#
# The issue body (or comment) is only read by scripts/drivers.py, which picks a row that's
# already in the script by folder, file and SHA-256.  Nothing from the issue
# is copied into the code.

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: promote-driver-${{ github.event.issue.number }}

jobs:
  promote:
    if: >-
      contains(github.event.issue.labels.*.name, 'driver-test') &&
      (github.event_name == 'issues' ||
       (!github.event.issue.pull_request &&
        (github.event.comment.user.login == github.event.issue.user.login ||
         github.event.comment.author_association == 'OWNER')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Move the driver, if the report says it works
        id: promote
        env:
          BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || github.event.issue.body }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/report.txt"
          set +e
          python3 scripts/drivers.py promote "$RUNNER_TEMP/report.txt" > "$RUNNER_TEMP/out.txt"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/out.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Check the change
        id: check
        if: steps.promote.outputs.rc == '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox dash
          set +e
          python3 scripts/drivers.py check > "$RUNNER_TEMP/check.txt" 2>&1
          drc=$?
          tests/run.sh busybox > "$RUNNER_TEMP/tests.txt" 2>&1
          trc=$?
          set -e
          cat "$RUNNER_TEMP/check.txt" "$RUNNER_TEMP/tests.txt"
          failed=$(sed -n 's/^Failed: *//p' "$RUNNER_TEMP/tests.txt" | tail -n 1)
          [ "$drc" = 0 ] || failed="scripts/drivers.py check ${failed}"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          if [ "$drc" = 0 ] && [ "$trc" = 0 ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi
      - name: Open a pull request
        if: steps.promote.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
          OK: ${{ steps.check.outputs.ok }}
          FAILED: ${{ steps.check.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          b="promote-driver-$N"
          what=$(tail -n 1 "$RUNNER_TEMP/out.txt")
          if gh pr view "$b" > /dev/null 2>&1; then
            echo "A pull request for #$N is already open."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$b"
          git commit -am "Offer a tested driver, from #$N" -m "$what"
          git push -f origin "$b"
          if [ "$OK" = 1 ]; then
            gh pr create --head "$b" --title "Offer a tested driver (from #$N)" --body "Driver test report #$N says it works.

          $what

          The tests and \`scripts/drivers.py check\` passed.  Check the report, merge, then tag a release so it reaches TVs."
          else
            # A test that used this driver as its untested example: still
            # open it, as a draft, so the report isn't lost
            gh pr create --draft --head "$b" --title "Offer a tested driver (from #$N): tests need updating" --body "Driver test report #$N says it works.

          $what

          After moving it, these failed: $FAILED.  Usually a test that used this driver as its example of an untested one: point it at another kernel, then mark this ready.  Run: $RUN_URL"
            echo "::warning::Pull request opened as a draft: $FAILED failed after moving the driver."
          fi
          gh issue comment "$N" --body "Thanks for testing!  It worked, so it's on its way to being offered to everyone with that TV: see the pull request for this report.  It reaches TVs with the next release."
