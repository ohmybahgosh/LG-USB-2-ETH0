name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck the script (POSIX sh, like the TV)
        run: shellcheck -s sh LG-USB-2-ETH0.sh tests/fakebin/* scripts/ai-context.sh tests/check-promote.sh tests/check-monitor.sh scripts/virtual-tv/luna-send scripts/virtual-tv/uname scripts/virtual-tv/syswrite scripts/virtual-tv/make-media.sh
      - name: ShellCheck the test suite
        run: shellcheck tests/run.sh scripts/virtual-tv/vtv.sh
      - name: Script parses under dash and busybox sh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox dash
          dash -n LG-USB-2-ETH0.sh
          busybox sh -n LG-USB-2-ETH0.sh

  issue-forms:
    name: Issue forms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the issue forms are valid (GitHub silently opens a blank issue if not)
        run: python3 tests/check-issue-forms.py
      - name: Build the AI knowledge base (checks it still works)
        run: sh scripts/ai-context.sh /tmp/lg-usb-2-eth0-for-ai.md

  drivers:
    name: Driver lists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The README's list, its counts and the badge match the script, and every SHA-256 matches the mirror
        run: python3 scripts/drivers.py check
      - name: Promoting a tested driver moves only that row
        run: |
          url=$(sed -n 's/^EXPERIMENTAL_URL="\(.*\)"$/\1/p' LG-USB-2-ETH0.sh)
          curl -fsSL -o "$RUNNER_TEMP/SHA256SUMS" "$url/SHA256SUMS"
          tests/check-promote.sh "$RUNNER_TEMP/SHA256SUMS"
      - name: The firmware monitor reads the index and writes its issues
        run: sh tests/check-monitor.sh

  test:
    name: Tests (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [busybox, dash, bash]
    steps:
      - uses: actions/checkout@v7
      - name: Install shells
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox dash
      - name: Run the test suite
        run: tests/run.sh ${{ matrix.shell }}

  app:
    name: TV app (IPK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check the app's JavaScript parses
        run: node --check webos-app/src/app.js && node --check webos-app/gen-manifest.js && node --check webos-app/gen-whatsnew.js
      - name: Build the IPK and manifest
        run: |
          npm install -g @webos-tools/cli
          webos-app/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ipk
          path: webos-app/out/
