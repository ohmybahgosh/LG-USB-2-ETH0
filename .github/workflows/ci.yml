name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck the script (POSIX sh, like the TV)
        run: shellcheck -s sh LG-USB-2-ETH0.sh tests/fakebin/* scripts/ai-context.sh
      - name: ShellCheck the test suite
        run: shellcheck tests/run.sh
      - name: Script parses under dash and busybox sh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox dash
          dash -n LG-USB-2-ETH0.sh
          busybox sh -n LG-USB-2-ETH0.sh

  issue-forms:
    name: Issue forms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the issue forms are valid (GitHub silently opens a blank issue if not)
        run: python3 tests/check-issue-forms.py
      - name: Build the AI knowledge base (checks it still works)
        run: sh scripts/ai-context.sh /tmp/lg-usb-2-eth0-for-ai.md

  test:
    name: Tests (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [busybox, dash, bash]
    steps:
      - uses: actions/checkout@v4
      - name: Install shells
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox dash
      - name: Run the test suite
        run: tests/run.sh ${{ matrix.shell }}

  app:
    name: TV app (IPK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the app's JavaScript parses
        run: node --check webos-app/src/app.js && node --check webos-app/gen-manifest.js
      - name: Build the IPK and manifest
        run: |
          npm install -g @webos-tools/cli
          webos-app/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: webos-app/out/
